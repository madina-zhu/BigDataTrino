services:
  postgres:
    image: postgres:15
    container_name: lab_postgres
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "25432:5432"
    volumes:
      - ./data:/data:ro
      - ./init-scripts/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # готов только когда init-скрипт отработал и загрузил 5000 строк (TCP, а не временный сервер инициализации)
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U user -d lab_db -tAc 'SELECT COUNT(*) FROM mock_data' | grep -qx 5000"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - trino_net

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: lab_clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"   # пользователь default без пароля доступен из сети docker (для Trino)
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data:/var/lib/clickhouse/user_files/data:ro
      - ./init-scripts/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT count() FROM default.mock_data' | grep -qx 5000"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - trino_net

  trino:
    image: trinodb/trino:435
    container_name: lab_trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino_scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - trino_net

networks:
  trino_net:
    driver: bridge
