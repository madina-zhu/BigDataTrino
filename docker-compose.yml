
services:
  postgres:
    image: postgres:15
    container_name: lab_postgres
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "25432:5432"
    volumes:
      - ./data:/data
      - ./init-scripts/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trino_net

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: lab_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data:/var/lib/clickhouse/user_files/data
      - ./init-scripts/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - trino_net

  trino:
    image: trinodb/trino:435
    container_name: lab_trino
    mem_limit: 2g

    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino_scripts:/scripts
    depends_on:
      - postgres
      - clickhouse
    networks:
      - trino_net

networks:
  trino_net:
    driver: bridge
